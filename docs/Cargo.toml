[package]
name = "warded-server-docs"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Compiles and runs the Rust examples on Warded Server's documentation site"

[lib]
path = "pages.rs"

[dev-dependencies]
axum = { version = "0.8.9", features = ["macros", "ws"] }
futures-util = { version = "0.3", default-features = false }
http-body-util = "0.1"
reqwest = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7"
tower = { version = "0.5.3", features = ["util", "limit"] }
tower-http = { version = "0.7", features = ["catch-panic", "compression-br", "compression-gzip", "cors", "fs", "limit", "set-header", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
warded-server = { path = ".." }

# The root package's lints, for the page checks in pages.rs.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
