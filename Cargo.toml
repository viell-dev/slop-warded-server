[package]
name = "warded-server"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
description = "Ready-wired HTTP/1.1, HTTP/2 and HTTP/3 server for Warded routes and Tower applications"
repository = "https://github.com/viell-dev/slop-warded-server"
readme = "README.md"
keywords = ["http", "http3", "server", "tower", "axum"]
categories = ["web-programming::http-server"]
include = ["/src/", "/examples/", "/tests/", "/README.md", "/LICENSE-*"]
# No package registry is an agreed distribution channel yet.
publish = false

[package.metadata.docs.rs]
all-features = true

[features]
default = ["http3", "self-signed", "warded"]
http3 = ["dep:bytes", "dep:h3", "dep:h3-quinn", "dep:http-body", "dep:httpdate", "dep:quinn"]
self-signed = ["dep:rcgen"]
warded = ["dep:percent-encoding", "dep:serde", "dep:serde_urlencoded", "dep:warded"]

[dependencies]
arc-swap = "1.9"
axum = { version = "0.8.9", default-features = false, features = ["tokio"] }
axum-server = { version = "0.9.2", features = ["tls-rustls-no-provider"] }
bytes = { version = "1", optional = true }
h3 = { version = "=0.0.8", optional = true }
h3-quinn = { version = "=0.0.10", optional = true }
http = "1.5"
http-body = { version = "1", optional = true }
httpdate = { version = "1", optional = true }
percent-encoding = { version = "2", optional = true }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
serde = { version = "1", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
warded = { version = "=0.1.0-beta.5", optional = true }

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http-body-util = { version = "0.1", features = ["channel"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
serde = { version = "1", features = ["derive"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tracing-subscriber = "0.3"

[[example]]
name = "hello"
required-features = ["self-signed", "warded"]

[[test]]
name = "hostile"
required-features = ["http3", "self-signed", "warded"]

[[test]]
name = "lifecycle"
required-features = ["http3", "self-signed", "warded"]

[[test]]
name = "signals"
required-features = ["http3", "self-signed", "warded"]

[[test]]
name = "protocols"
required-features = ["http3", "self-signed", "warded"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
