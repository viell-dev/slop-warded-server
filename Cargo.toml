[package]
name = "warded-server"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.99.1"
license = "MIT OR Apache-2.0"
description = "Ready-wired HTTP/1.1, HTTP/2 and HTTP/3 server for Warded routes and Tower applications"
repository = "https://github.com/viell-dev/slop-warded-server"
homepage = "https://viell-dev.github.io/slop-warded-server/"
readme = "README.md"
keywords = ["http", "http3", "server", "tower", "axum"]
categories = ["web-programming::http-server"]
include = ["/src/", "/examples/", "/tests/", "/README.md", "/LICENSE-*"]
# No package registry is an agreed distribution channel yet.
publish = false

[package.metadata.docs.rs]
all-features = true

[features]
default = ["files", "http3", "logging", "middleware", "self-signed", "warded"]
files = ["dep:mime_guess", "dep:tower-http", "tower-http/fs", "tower-http/set-header"]
http3 = ["dep:bytes", "dep:h3", "dep:httpdate", "dep:nix", "dep:quinn"]
logging = ["dep:tracing-subscriber"]
middleware = [
    "dep:tower-http",
    "tower-http/catch-panic",
    "tower-http/compression-br",
    "tower-http/compression-gzip",
    "tower-http/trace",
]
self-signed = ["dep:rcgen"]
warded = [
    "dep:form_urlencoded",
    "dep:percent-encoding",
    "dep:serde",
    "dep:serde_path_to_error",
    "dep:serde_urlencoded",
    "dep:warded",
]

[dependencies]
arc-swap = "1.9"
axum = { version = "0.8.9", default-features = false, features = ["tokio"] }
axum-server = { version = "0.9.2", features = ["tls-rustls-no-provider"] }
bytes = { version = "1", optional = true }
form_urlencoded = { version = "1", optional = true }
h3 = { version = "=0.0.8", optional = true }
http = "1.5"
http-body = "1"
httpdate = { version = "1", optional = true }
mime_guess = { version = "2.0.5", optional = true }
percent-encoding = { version = "2", optional = true }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs"], optional = true }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"], optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum", "std", "tls12"] }
serde = { version = "1", optional = true }
serde_path_to_error = { version = "0.1", optional = true }
serde_urlencoded = { version = "0.7", optional = true }
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", optional = true }
tower-livereload = "0.10.3"
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.23", optional = true, features = ["env-filter"] }
warded = { version = "=0.1.0-beta.5", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.32.0", default-features = false, features = ["net"], optional = true }

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
h3-quinn = "=0.0.10"
http-body-util = { version = "0.1", features = ["channel"] }
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tracing-subscriber = "0.3"

[[example]]
name = "hello"
required-features = ["self-signed", "warded"]

[[test]]
name = "development"
required-features = ["files", "http3", "middleware", "self-signed", "warded"]

[[test]]
name = "helpers"
required-features = ["files", "http3", "middleware", "self-signed", "warded"]

[[test]]
name = "hostile"
required-features = ["http3", "self-signed", "warded"]

[[test]]
name = "lifecycle"
required-features = ["http3", "self-signed", "warded"]

[[test]]
name = "log"
required-features = ["http3", "self-signed", "warded"]

[[test]]
name = "signals"
required-features = ["http3", "self-signed", "warded"]

[[test]]
name = "protocols"
required-features = ["http3", "self-signed", "warded"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

# The documentation site's example checks are an unpublished member; see docs/Cargo.toml.
[workspace]
members = ["docs"]
